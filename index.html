
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famille Rehoboth-Suivi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f1f4f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 28px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      font-size: 38px;
      margin-bottom: 12px;
    }

    h1 {
      color: #173b65;
      font-size: 24px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #667085;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .field {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #344054;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #8bb7e8;
      border-color: #2867a5;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #173b65;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #245486;
    }

    #loginMessage {
      margin-top: 16px;
      font-size: 14px;
      color: #b42318;
      min-height: 20px;
    }

    .footer {
      margin-top: 28px;
      color: #98a2b3;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="container">
    <div class="logo">🏠</div>

    <h1>FAMILLE REHOBOTH</h1>

    <p class="subtitle">
      Suivi • Participation • Engagement
    </p>

    <form id="loginForm">

      <div class="field">
        <label for="username">Identifiant</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Votre identifiant"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Votre mot de passe"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" id="loginButton">
        Se connecter
      </button>

      <p id="loginMessage" role="alert"></p>

    </form>

    <div class="footer">
      ICC Bruxelles • Famille Rehoboth
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
